<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quack</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #0a0a0c;
      }

      /* Overlay loader - masks everything until backend loads */
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0a0a0c;
        z-index: 99999;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #app-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      /* Ensure app content is ready before reveal */
      #root {
        opacity: 1;
      }

      /* Three dots loader */
      .loader-dots {
        display: flex;
        gap: 8px;
      }

      .loader-dots span {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #FF6B35;
        animation: dotPulse 1.4s ease-in-out infinite;
      }

      .loader-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .loader-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes dotPulse {
        0%, 80%, 100% {
          transform: scale(0.5);
          opacity: 0.3;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* Reduced motion support */
      @media (prefers-reduced-motion: reduce) {
        .loader-dots span {
          animation: none;
          opacity: 0.7;
        }
        #app-loader {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Overlay loader - stays on top until backend data loads -->
    <div id="app-loader">
      <div class="loader-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
