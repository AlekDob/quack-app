<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quack</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #0a0a0c;
      }

      /* Overlay loader - masks everything until backend loads */
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background-color: #0a0a0c;
        z-index: 99999;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #app-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      /* Ensure app content is ready before reveal */
      #root {
        opacity: 1;
      }

      /* Duck parade loader */
      .duck-parade-loader {
        position: relative;
        width: 300px;
        height: 40px;
        overflow: hidden;
        mask-image: linear-gradient(
          90deg,
          transparent 0%,
          black 15%,
          black 85%,
          transparent 100%
        );
        -webkit-mask-image: linear-gradient(
          90deg,
          transparent 0%,
          black 15%,
          black 85%,
          transparent 100%
        );
      }

      .duck-loader {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        font-family: 'SF Mono', 'Monaco', 'Courier New', monospace;
        font-size: 20px;
        font-weight: 600;
        color: #f28c52;
        white-space: nowrap;
        animation: duckMarchLoader 3s linear infinite, duckWaddleLoader 0.5s ease-in-out infinite;
        text-shadow: 0 2px 8px rgba(242, 140, 82, 0.4);
      }

      /* Stagger start positions so ducks are already visible */
      .duck-loader:nth-child(1) { left: 0%; animation-delay: 0s, 0s; }
      .duck-loader:nth-child(2) { left: 20%; animation-delay: 0s, 0.1s; }
      .duck-loader:nth-child(3) { left: 40%; animation-delay: 0s, 0.2s; }
      .duck-loader:nth-child(4) { left: 60%; animation-delay: 0s, 0.3s; }
      .duck-loader:nth-child(5) { left: 80%; animation-delay: 0s, 0.4s; }

      @keyframes duckMarchLoader {
        0% {
          transform: translateY(-50%) translateX(0);
        }
        100% {
          transform: translateY(-50%) translateX(100px);
        }
      }

      @keyframes duckWaddleLoader {
        0%, 100% {
          transform: translateY(-50%) translateY(-2px);
        }
        50% {
          transform: translateY(-50%) translateY(2px);
        }
      }

      /* Quack text */
      .loader-title {
        font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Monaco', monospace;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.4);
        margin-top: 8px;
      }

      /* Reduced motion support */
      @media (prefers-reduced-motion: reduce) {
        .duck-loader {
          animation: none;
        }
        .duck-loader:not(:first-child) {
          display: none;
        }
        .duck-loader:first-child {
          left: 50%;
          transform: translateX(-50%) translateY(-50%);
        }
        #app-loader {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Overlay loader - stays on top until backend data loads -->
    <div id="app-loader">
      <div class="duck-parade-loader">
        <span class="duck-loader">>°)></span>
        <span class="duck-loader">>^)></span>
        <span class="duck-loader">>·)></span>
        <span class="duck-loader">>~)></span>
        <span class="duck-loader">>´)></span>
      </div>
      <span class="loader-title">quack</span>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
