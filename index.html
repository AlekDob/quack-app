<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quack</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #0a0a0c;
      }

      /* Overlay loader - masks everything until backend loads */
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background-color: #0a0a0c;
        z-index: 99999;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #app-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      /* Ensure app content is ready before reveal */
      #root {
        opacity: 1;
      }

      /* Duck parade loader - single ASCII duck that transforms */
      .duck-parade-loader {
        position: relative;
        width: 80px;
        height: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .duck-morph {
        font-family: 'SF Mono', 'Monaco', 'Courier New', monospace;
        font-size: 24px;
        font-weight: 600;
        color: #f28c52;
        white-space: nowrap;
        text-shadow: 0 2px 12px rgba(242, 140, 82, 0.5);
        animation: duckMorph 2s steps(1) infinite, duckBob 0.4s ease-in-out infinite;
      }

      /* Morphing animation - cycles through different duck expressions */
      @keyframes duckMorph {
        0%   { content: ">°)>"; }
        20%  { content: ">^)>"; }
        40%  { content: ">·)>"; }
        60%  { content: ">~)>"; }
        80%  { content: ">´)>"; }
        100% { content: ">°)>"; }
      }

      /* Bobbing animation - duck waddle effect */
      @keyframes duckBob {
        0%, 100% {
          transform: translateY(-3px) rotate(-2deg);
        }
        50% {
          transform: translateY(3px) rotate(2deg);
        }
      }

      /* Duck expression spans - we'll use visibility keyframes */
      .duck-frame {
        position: absolute;
        font-family: 'SF Mono', 'Monaco', 'Courier New', monospace;
        font-size: 24px;
        font-weight: 600;
        color: #f28c52;
        white-space: nowrap;
        text-shadow: 0 2px 12px rgba(242, 140, 82, 0.5);
        animation: duckBob 0.4s ease-in-out infinite;
        opacity: 0;
      }

      .duck-frame:nth-child(1) { animation: duckFrame1 2s linear infinite, duckBob 0.4s ease-in-out infinite; }
      .duck-frame:nth-child(2) { animation: duckFrame2 2s linear infinite, duckBob 0.4s ease-in-out infinite; }
      .duck-frame:nth-child(3) { animation: duckFrame3 2s linear infinite, duckBob 0.4s ease-in-out infinite; }
      .duck-frame:nth-child(4) { animation: duckFrame4 2s linear infinite, duckBob 0.4s ease-in-out infinite; }
      .duck-frame:nth-child(5) { animation: duckFrame5 2s linear infinite, duckBob 0.4s ease-in-out infinite; }

      @keyframes duckFrame1 {
        0%, 19.9%   { opacity: 1; }
        20%, 100%   { opacity: 0; }
      }
      @keyframes duckFrame2 {
        0%, 19.9%   { opacity: 0; }
        20%, 39.9%  { opacity: 1; }
        40%, 100%   { opacity: 0; }
      }
      @keyframes duckFrame3 {
        0%, 39.9%   { opacity: 0; }
        40%, 59.9%  { opacity: 1; }
        60%, 100%   { opacity: 0; }
      }
      @keyframes duckFrame4 {
        0%, 59.9%   { opacity: 0; }
        60%, 79.9%  { opacity: 1; }
        80%, 100%   { opacity: 0; }
      }
      @keyframes duckFrame5 {
        0%, 79.9%   { opacity: 0; }
        80%, 100%   { opacity: 1; }
      }

      /* Quack text */
      .loader-title {
        font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Monaco', monospace;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.4);
        margin-top: 8px;
      }

      /* Reduced motion support */
      @media (prefers-reduced-motion: reduce) {
        .duck-frame {
          animation: none !important;
        }
        .duck-frame:not(:first-child) {
          display: none;
        }
        .duck-frame:first-child {
          opacity: 1;
        }
        #app-loader {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Overlay loader - stays on top until backend data loads -->
    <div id="app-loader">
      <div class="duck-parade-loader">
        <span class="duck-frame">>°)></span>
        <span class="duck-frame">>^)></span>
        <span class="duck-frame">>·)></span>
        <span class="duck-frame">>~)></span>
        <span class="duck-frame">>´)></span>
      </div>
      <span class="loader-title">quack</span>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
