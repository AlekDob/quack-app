[package]
name = "app"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }
dotenvy = "0.15"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9", features = ["tray-icon", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util"] }
anyhow = "1.0"
once_cell = "1.19"
portable-pty = "0.8"
uuid = { version = "1.10", features = ["serde", "v4"] }
dirs = "5.0"
regex = "1"
reqwest = { version = "0.12", features = ["json", "multipart"] }  # Used for Gumroad API and Supabase REST API
base64 = "0.22"
serde_yaml = "0.9"
chrono = "0.4"
keyring = "3.6"
tiny_http = "0.12"
rand = "0.8"
urlencoding = "2.1"
open = "5.0"
zip = "2.1"
tar = "0.4"
flate2 = "1.0"
walkdir = "2"
fuzzy-matcher = "0.3"
image = "0.25"
tauri-plugin-mic-recorder = "2.0"
rayon = "1.10"
lazy_static = "1.5"
hostname = "0.4"  # Used to get device name for license tracking
notify = "8.2"  # File system watcher for semantic search
notify-debouncer-full = "0.6"  # Debounced file watcher events (supports notify 8.x)
glob = "0.3"  # Pattern matching for file filtering
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }  # SQLite for Quack Brain

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
libc = "0.2"  # For getpwuid to get home directory when $HOME is not set

# 🔐 Security-optimized production build profile
[profile.release]
opt-level = "z"        # Optimize for size and performance
lto = true             # Link Time Optimization (slower build, smaller/faster binary)
codegen-units = 1      # Single codegen unit for better optimization
strip = true           # Strip debug symbols from binary
panic = "abort"        # Smaller panic handler
